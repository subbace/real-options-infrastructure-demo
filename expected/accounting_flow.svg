<svg xmlns="http://www.w3.org/2000/svg" width="940" height="195" viewBox="0 0 940 195" role="img" aria-labelledby="title desc"><title id="title">Synthetic cash-account sequence</title><desc id="desc">Fixed artificial scenario. Initial cash one BTC, final cash 0.976 BTC after premium and explicit fees. Not investment performance.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#145c50"/></marker></defs><rect width="940" height="195" fill="white"/><g font-family="Arial,sans-serif" fill="#172c2d"><text x="20" y="30" font-size="17">Synthetic accounting example</text><rect x="20" y="60" width="200" height="80" rx="5" fill="#eef4ef" stroke="#145c50"/><text x="120" y="88" text-anchor="middle" font-size="13">Initial</text><text x="120" y="118" text-anchor="middle" font-size="19">1 BTC</text><path d="M221 100h22" stroke="#145c50" marker-end="url(#arrow)"/><rect x="245" y="60" width="200" height="80" rx="5" fill="#eef4ef" stroke="#145c50"/><text x="345" y="88" text-anchor="middle" font-size="13">Option bought</text><text x="345" y="118" text-anchor="middle" font-size="19">0.979 BTC</text><path d="M446 100h22" stroke="#145c50" marker-end="url(#arrow)"/><rect x="470" y="60" width="200" height="80" rx="5" fill="#eef4ef" stroke="#145c50"/><text x="570" y="88" text-anchor="middle" font-size="13">Future sold</text><text x="570" y="118" text-anchor="middle" font-size="19">0.978 BTC</text><path d="M671 100h22" stroke="#145c50" marker-end="url(#arrow)"/><rect x="695" y="60" width="200" height="80" rx="5" fill="#eef4ef" stroke="#145c50"/><text x="795" y="88" text-anchor="middle" font-size="13">Expiry settled</text><text x="795" y="118" text-anchor="middle" font-size="19">0.976 BTC</text><text x="20" y="175" font-size="12">Fixed inputs, not market observations; the negative cash change is not a strategy backtest.</text></g></svg>
